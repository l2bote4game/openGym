services:
  - type: web
    name: opengym
    env: node
    buildCommand: cd frontend && npm install && npm run build:mobile && cd ../api && npm install
    startCommand: node api/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/data
      - key: RP_NAME
        value: openGym
